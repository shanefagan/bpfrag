[package]
name = "bpfrag"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Shane Fagan <mail@shanefagan.com>"]
license = "MIT"
description = "eBPF-driven, self-reverting network tuning for competitive gaming on Linux"
readme = "README.md"
keywords = ["ebpf", "gaming", "latency", "tuning", "linux"]
categories = ["command-line-utilities", "games"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "0.27"
libbpf-sys = "1.7"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[build-dependencies]
bindgen = "0.72"
libbpf-cargo = "0.27"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
