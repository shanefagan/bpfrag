[package]
name = "bpfrag"
version = "0.7.1"
edition = "2024"
rust-version = "1.85"
authors = ["Shane Fagan <mail@shanefagan.com>"]
license = "MIT"
description = "eBPF-driven, self-reverting network tuning for competitive gaming on Linux"
readme = "README.md"
repository = "https://github.com/shanefagan/bpfrag"
homepage = "https://github.com/shanefagan/bpfrag"
keywords = ["ebpf", "gaming", "latency", "tuning", "linux"]
categories = ["command-line-utilities", "games"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dbus = { version = "0.9", default-features = false }
libbpf-rs = "0.27"
libbpf-sys = "1.7"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[build-dependencies]
bindgen = "0.73"
libbpf-cargo = "0.27"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# `cargo deb` (cargo install cargo-deb) builds a .deb from this.
[package.metadata.deb]
maintainer = "Shane Fagan <mail@shanefagan.com>"
copyright = "2025-2026, Shane Fagan"
license-file = ["LICENSE", "0"]
extended-description = """\
bpfrag counts UDP traffic per process with eBPF. When a game's network \
traffic appears (a steady, two-way, small-packet stream from a process \
classified as a game), it applies a networking profile for the length of \
the match: socket busy polling, NIC interrupt coalescing, buffer headroom, \
DSCP marking of the game's packets and Wi-Fi power save. Every change is \
journalled and restored when the match ends. It does not touch CPU \
scheduling and yields bpftune's sysctls while bpftune runs."""
section = "net"
priority = "optional"
depends = "$auto"
recommends = "ethtool, iw"
assets = [
    ["target/release/bpfrag", "usr/bin/", "755"],
    ["dist/bpfrag.default", "etc/default/bpfrag", "644"],
    ["dist/bpfrag.toml", "etc/bpfrag/bpfrag.toml", "644"],
    ["dist/bpfrag.8", "usr/share/man/man8/bpfrag.8", "644"],
    ["dist/com.performativenonsense.Bpfrag1.conf", "usr/share/dbus-1/system.d/", "644"],
    ["README.md", "usr/share/doc/bpfrag/README.md", "644"],
    ["LICENSE-GPL-2.0", "usr/share/doc/bpfrag/LICENSE-GPL-2.0", "644"],
]
conf-files = ["/etc/default/bpfrag", "/etc/bpfrag/bpfrag.toml"]
# Enabled and started on first install; it does nothing until a match is
# detected. On removal the unit is stopped while /usr/bin/bpfrag still
# exists, so ExecStopPost can restore any settings changed during a match.
changelog = "packaging/debian/changelog"
maintainer-scripts = "packaging/debian/"
systemd-units = { unit-scripts = "dist/", enable = true, start = true }
