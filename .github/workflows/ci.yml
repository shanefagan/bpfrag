# SPDX-License-Identifier: MIT
#
# Every push runs the tests and builds the .deb, .rpm and binary tarball.
# Pushing a tag vX.Y.Z (see `just bump`) also publishes them as a GitHub
# release.
#
# Every build and test step is a recipe in the justfile, so CI runs what a
# developer runs (`just ci` is the test job). Steps here only install
# tools.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    # Known vulnerabilities, licences and sources of every dependency, and
    # the systemd unit's sandboxing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny and just
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          cargo install --locked cargo-deny

      - name: Dependencies
        run: just deny

      - name: Unit sandboxing
        run: just unit-security

  test:
    # GitHub's Ubuntu runners have kernel BTF, the sock_*_length tracepoints
    # and tcx (bpfrag needs 6.6+) and passwordless sudo, so the BPF side runs for
    # real here, not just compiles.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libelf-dev libdbus-1-dev zlib1g-dev pkg-config tcpdump iproute2 just

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # The same steps as `just ci`, one at a time so each shows up on its own.
      - name: Format
        run: just fmt-check

      - name: Clippy
        run: just lint

      - name: Unit tests
        run: just test

      - name: Build
        run: just build

      - name: What the runner supports
        run: just check-system

      - name: BPF selftest (packet vectors through both tc programs)
        run: just selftest

      - name: End-to-end (netns, fake game, noise, crash recovery)
        run: just e2e

      - name: End-to-end with only the systemd unit's capabilities
        run: just e2e-unit

  msrv:
    # rust-version in Cargo.toml: 1.85, Debian 13's rustc.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libelf-dev libdbus-1-dev zlib1g-dev pkg-config just
      - name: Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal
      - name: Check
        run: just msrv

  deb:
    # Built on Ubuntu 22.04 (glibc 2.35) so the package installs on
    # Ubuntu 22.04+ and Debian 12+.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            clang libclang-dev libelf-dev libdbus-1-dev zlib1g-dev pkg-config dpkg-dev lintian
      - uses: actions/checkout@v7
      - name: Rust toolchain, cargo-deb and just
        # Ubuntu 22.04 has no just package.
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install cargo-deb just --locked
      - name: Build .deb
        run: just deb
      - name: Lint
        run: just deb-lint
      - name: Binary tarball (glibc 2.35+, any distro)
        run: just tarball
      - name: Install, run the installed binary, remove, purge
        run: just deb-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: bpfrag-deb
          path: |
            target/debian/*.deb
            target/bpfrag-*-x86_64-linux.tar.gz

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: Install rpm tooling
        run: dnf -y install git rpm-build rpmlint just
      - uses: actions/checkout@v7
      - name: Install the spec's BuildRequires
        run: dnf -y builddep packaging/rpm/bpfrag.spec
      - name: Build .src.rpm and .rpm
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just rpm
      - name: Lint
        run: just rpm-lint
      - name: Install, run the installed binary, remove
        run: just rpm-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: bpfrag-rpm
          path: |
            target/rpm/RPMS/*/*.rpm
            target/rpm/SRPMS/*.rpm
            target/rpm/SOURCES/*-vendor.tar.xz

  release:
    # A vX.Y.Z tag publishes everything the jobs above built.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Tag matches the version in Cargo.toml
        run: just check-tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish the release
        # The release notes are the annotated tag's message, without its
        # signature. checkout can leave the tag as a plain ref, so fetch the
        # tag object itself. Not gh's --notes-from-tag: with --repo it never
        # reads the local tag and fails with "does not exist locally".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag --list "$GITHUB_REF_NAME" --format='%(contents:subject)%0a%0a%(contents:body)' > notes.md
          if grep -q -- '-----BEGIN .* SIGNATURE-----' notes.md; then
            echo "::error::the tag message contains an old signature; re-tag with the notes from a file (git tag -s -f -F notes.md $GITHUB_REF_NAME)"
            exit 1
          fi
          printf '\n' >> notes.md
          cat packaging/release-files.md >> notes.md
          mkdir release
          find artifacts -type f -exec mv -t release/ {} +
          (cd release && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "bpfrag ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag release/*
