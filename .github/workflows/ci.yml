# SPDX-License-Identifier: MIT
#
# Every push runs the tests and builds the .deb, .rpm and binary tarball.
# Pushing a tag vX.Y.Z (see packaging/bump-version.sh) also publishes them
# as a GitHub release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # GitHub's Ubuntu runners have kernel BTF, the sock_*_length tracepoints
    # (>= 6.4), tcx (>= 6.6) and passwordless sudo, so the BPF side runs for
    # real here, not just compiles.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libelf-dev zlib1g-dev pkg-config tcpdump iproute2

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: What the runner supports
        run: sudo ./target/release/bpfrag --check || true

      - name: BPF selftest (packet vectors through the DSCP marker)
        run: sudo ./target/release/bpfrag --selftest

      - name: End-to-end (netns, fake game, noise, crash recovery)
        run: sudo tests/rig/e2e.sh target/release/bpfrag

      - name: End-to-end with only the systemd unit's capabilities
        run: sudo tests/rig/e2e.sh tests/rig/unit-caps.sh

  msrv:
    # rust-version in Cargo.toml: 1.85, Debian 13's rustc.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libelf-dev zlib1g-dev pkg-config
      - name: Rust 1.85
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
      - name: Check
        run: cargo check --locked --all-targets

  deb:
    # Built on Ubuntu 22.04 (glibc 2.35) so the package installs on
    # Ubuntu 22.04+ and Debian 12+.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            clang libclang-dev libelf-dev zlib1g-dev pkg-config dpkg-dev lintian
      - uses: actions/checkout@v7
      - name: Rust toolchain and cargo-deb
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install cargo-deb --locked
      - name: Build .deb
        run: cargo deb --locked
      - name: Lint
        run: lintian --suppress-tags initial-upload-closes-no-bugs target/debian/*.deb
      - name: Binary tarball (glibc 2.35+, any distro)
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          d=bpfrag-$ver-x86_64-linux
          mkdir -p "target/$d"
          cp target/release/bpfrag dist/bpfrag.service dist/bpfrag.8 dist/bpfrag.toml \
            dist/bpfrag.default README.md LICENSE LICENSE-GPL-2.0 "target/$d/"
          tar -C target -czf "target/$d.tar.gz" "$d"
      - name: Install, selftest the installed binary, remove, purge
        run: |
          apt-get install -y ./target/debian/*.deb
          bpfrag --version
          bpfrag --dump-config >/dev/null
          apt-get remove -y bpfrag
          apt-get purge -y bpfrag
          test ! -e /etc/bpfrag
      - uses: actions/upload-artifact@v7
        with:
          name: bpfrag-deb
          path: |
            target/debian/*.deb
            target/bpfrag-*-x86_64-linux.tar.gz

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: Install rpm tooling
        run: dnf -y install git rpm-build rpmlint
      - uses: actions/checkout@v7
      - name: Install the spec's BuildRequires
        run: dnf -y builddep packaging/rpm/bpfrag.spec
      - name: Build .src.rpm and .rpm
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/rpm/build.sh
      - name: Lint
        run: rpmlint -r packaging/rpm/bpfrag.rpmlintrc target/rpm/RPMS/*/*.rpm target/rpm/SRPMS/*.rpm
      - name: Install and remove
        run: |
          dnf -y install target/rpm/RPMS/*/bpfrag-[0-9]*.rpm
          bpfrag --version
          bpfrag --dump-config >/dev/null
          dnf -y remove bpfrag
      - uses: actions/upload-artifact@v7
        with:
          name: bpfrag-rpm
          path: |
            target/rpm/RPMS/*/*.rpm
            target/rpm/SRPMS/*.rpm
            target/rpm/SOURCES/*-vendor.tar.xz

  release:
    # A vX.Y.Z tag publishes everything the jobs above built.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in Cargo.toml
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $ver (run packaging/bump-version.sh)"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish the release
        # The release notes are the annotated tag's message, without its
        # signature. checkout can leave the tag as a plain ref, so fetch the
        # tag object itself. Not gh's --notes-from-tag: with --repo it never
        # reads the local tag and fails with "does not exist locally".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag --list "$GITHUB_REF_NAME" --format='%(contents:subject)%0a%0a%(contents:body)' > notes.md
          if grep -q -- '-----BEGIN .* SIGNATURE-----' notes.md; then
            echo "::error::the tag message contains an old signature; re-tag with the notes from a file (git tag -s -f -F notes.md $GITHUB_REF_NAME)"
            exit 1
          fi
          mkdir release
          find artifacts -type f -exec mv -t release/ {} +
          (cd release && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "bpfrag ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag release/*
