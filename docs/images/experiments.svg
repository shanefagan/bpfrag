<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" role="img">
<title>Each experiment, one dot per match</title>
<desc>bulk: on 3 matches, median longest gap 40 ms, off 3 matches, median longest gap 41 ms; writeback: on 12 matches, median longest gap 41 ms, off 6 matches, median longest gap 41 ms</desc>

<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; }
  .ink2 { fill: #52514e; }
  .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .band { fill: #0b0b0b; fill-opacity: 0.05; }
  .s1 { stroke: #2a78d6; fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .s1fill { fill: #2a78d6; }
  .s2ring { fill: #fcfcfb; stroke: #eb6834; stroke-width: 2; }
  .s2fill { fill: #eb6834; }
  .dotring { stroke: #fcfcfb; stroke-width: 2; }
  .mark { stroke: #0b0b0b; stroke-width: 2; }
  .threshold { stroke: #898781; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; }
    .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .band { fill: #f0efec; fill-opacity: 0.07; }
    .s1 { stroke: #3987e5; }
    .s1fill { fill: #3987e5; }
    .s2ring { fill: #1a1a19; stroke: #d95926; }
    .s2fill { fill: #d95926; }
    .dotring { stroke: #1a1a19; }
    .mark { stroke: #f0efec; }
  }
</style>
