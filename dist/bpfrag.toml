# /etc/bpfrag/bpfrag.toml
#
# Everything here is optional: delete what you don't change. Run
# `bpfrag --dump-config` to see the full effective configuration.

[general]
# tick_ms = 1000       # sampling window
# Sharing with bpftune. bpftune switches its own tuners off if anyone else
# writes their sysctls, so by default bpfrag leaves those to it while it runs.
# bpftune = "auto"     # "auto" | "yield" | "ignore"
# Where today's [experiment] pick is kept, across reboots.
# state_dir = "/var/lib/bpfrag"
# Publish the read-only D-Bus interface (docs/dbus.md) on the system bus.
# dbus = true

[detect]
# min_pps = 25           # smoothed pkt/s (tx+rx) before a process counts
# competitive_pps = 70   # tier thresholds, with +/- margin of hysteresis
# intense_pps = 140
# margin = 15
# linger_secs = 15       # quiet time before the match is over
# pin_tier = "competitive"   # ignore the tick rate, always use this tier

[classify]
# Native games launched outside Steam/Lutris/Heroic etc. can also be tagged
# per launch with BPFRAG_GAME=1 in the environment (e.g. Steam launch
# options: BPFRAG_GAME=1 %command%).
# allow = ["mynativegame", "Moonlight"]
# deny = ["some-voip-thing*"]
# launchers = ["my-launcher"]

[dscp]
# class = "CS4"          # RFC 4594 real-time interactive; EF if your router wants it
# override = false       # also rewrite packets the game already marked
# interfaces = ["wlan0"] # default: interfaces with a default route

# Bulk transfers during a match (a Steam download, a torrent) can be marked
# low priority, so CAKE (diffserv3/4/8) or a QoS router serves the game first.
# Off by default: while off, they are still shown in --monitor and the log.
[bulk]
# enabled = true
# class = "LE"           # RFC 8622 lower effort; CS1 for routers that predate LE
# min_mbps = 2           # a process moving this much (sent + received)...
# secs = 5               # ...for this many seconds in a row is bulk
# release_secs = 10      # seconds below the rate before it isn't
# never = ["rclone"]     # never demoted, besides OBS, voice apps and VPN clients
# always = ["my-sync*"]  # demoted whenever they move anything, besides torrent clients

# A/B testing: switch one setting off in a random share of matches, so you
# can compare matches with and without it (docs/measuring.md). The log and
# each match's health line say which it got. Not used in a dry run.
#
# "random" tests one setting per day (or per boot), picked from a pool and
# saved in /var/lib/bpfrag, leaving out settings this machine already has.
# Or name one: dscp, wifi_power_save, coalescing, busy_polling,
# socket_buffers, backlog, budget, writeback, bulk, sysctl:<name>, or all
# (every setting at once: the whole package, not one cause).
[experiment]
# setting = "random"
# pool = "wired"         # with random: "auto" (by the default route), "wired",
#                        # "wifi", or a list such as ["busy_polling", "backlog"]
# period = "day"         # with random: "day" (from 05:00) or "boot"
# keep = 0.5             # share of matches that keep it on

# Tiers: [tier.all] applies to every tier, then [tier.casual],
# [tier.competitive], [tier.intense]. `knob = false` turns a knob off.
# sysctl values prefixed with ">=" are raise-only.

# [tier.all]
# writeback = false                         # leave dirty writeback alone
# wifi_powersave_off = false                # leave Wi-Fi power save alone

# [tier.intense]
# coalesce_usecs = 5                        # instead of 0
# sysctl = { "net.core.busy_poll" = 50, "net.core.busy_read" = false }
