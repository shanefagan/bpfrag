<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  bpfrag's read-only D-Bus interface (docs/dbus.md).

  Only root (the bpfrag service) may own the name. Anyone may read its
  properties and introspect it; its signals reach everyone under the
  bus's default policy. It has no methods, and Set is not allowed here
  either, so nothing on the bus can change what bpfrag does.
-->
<busconfig>
  <policy user="root">
    <allow own="com.performativenonsense.Bpfrag1"/>
  </policy>

  <policy context="default">
    <allow send_destination="com.performativenonsense.Bpfrag1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="com.performativenonsense.Bpfrag1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="com.performativenonsense.Bpfrag1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.performativenonsense.Bpfrag1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
